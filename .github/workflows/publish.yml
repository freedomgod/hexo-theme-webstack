name: Publish theme

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # The version commit this job pushes would otherwise start the job again;
    # the empty commit range already skips it, this keeps the run out of the list.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm >= 11.5.1, the first version that can publish
          # through trusted publishing (OIDC) without a stored token.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Bump version from conventional commits
        id: bump
        run: node tools/bump-version.cjs
      - name: Publish to npm
        if: steps.bump.outputs.version != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Trusted publishing signs the publish with the workflow's OIDC token
          # and needs no secret. A token is only used when one is configured.
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --provenance || {
            echo "::error title=Publish failed::Add a trusted publisher for this package on npmjs.com (Settings -> Trusted publishing -> GitHub Actions, repository freedomgod/hexo-theme-webstack-next, workflow publish.yml), or configure the NPM_TOKEN secret, then run this workflow again."
            exit 1
          }
      - name: Push release commit and tag
        if: steps.bump.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:master --follow-tags
